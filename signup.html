<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ariyan Zone | Sign Up</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;

    background: #07070c;
    color: white;
}

.signup-box {

    width: 90%;
    max-width: 400px;

    padding: 30px 25px;

    background:
    linear-gradient(145deg, #171720, #101017);

    border: 1px solid #29293a;

    border-radius: 22px;

    box-shadow:
    0 10px 35px rgba(0,0,0,0.45);

    text-align: center;
}

.logo {
    font-size: 42px;
}

h1 {
    margin: 10px 0;
}

.subtitle {
    color: #9999ad;

    font-size: 14px;

    margin-bottom: 25px;
}

.input {

    width: 100%;

    padding: 14px;

    margin: 8px 0;

    border-radius: 12px;

    border: 1px solid #33334a;

    background: #0d0d14;

    color: white;

    outline: none;

    font-size: 15px;
}

.input:focus {
    border-color: #8b5cf6;
}

.signup-btn {

    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: none;

    border-radius: 12px;

    background: #7c3aed;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.signup-btn:hover {
    background: #8b5cf6;
}

.login {

    margin-top: 20px;

    color: #9999ad;

    font-size: 14px;
}

.login a,
.back {

    color: #a78bfa;

    text-decoration: none;

    font-weight: bold;
}

.back {

    display: inline-block;

    margin-top: 20px;
}

</style>

</head>


<body>


<div class="signup-box">

    <div class="logo">
        🔥
    </div>

    <h1>
        Create Account
    </h1>

    <p class="subtitle">
        Join Ariyan Zone
    </p>


    <input
        type="text"
        class="input"
        placeholder="Your Name"
    >


    <input
        type="email"
        class="input"
        placeholder="Email"
    >


    <input
        type="password"
        class="input"
        placeholder="Password"
    >


    <input
        type="password"
        class="input"
        placeholder="Confirm Password"
    >


    <button class="signup-btn">
        📝 Create Account
    </button>


    <div class="login">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


    <a href="index.html" class="back">
        ⬅ Back to Home
    </a>

</div>


</body>

</html>
