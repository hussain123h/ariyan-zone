<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ariyan Zone</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #08080d;
    color: white;
}

header {
    text-align: center;
    padding: 35px 15px;
    background: linear-gradient(135deg, #15152e, #32105c);
}

header h1 {
    font-size: 42px;
    margin: 10px 0;
}

header p {
    color: #c8c8d8;
}

.menu {
    padding: 25px 15px;
}

.card {
    background: #171720;
    margin: 15px 0;
    padding: 22px;
    border-radius: 18px;
    text-align: center;
    border: 1px solid #29293a;
}

.card h2 {
    margin-top: 5px;
}

.card p {
    color: #aaaabd;
}

button {
    background: #7c3aed;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 16px;
}
</style>
</head>

<body>

<header>
    <h1>🔥 Ariyan Zone</h1>
    <p>Gaming • Free Fire • Updates</p>
</header>

<div class="menu">

    <div class="card">
        <h2>🎯 Sensitivity</h2>
        <p>Free Fire sensitivity settings</p>
        <button onclick="alert('General: 95\nRed Dot: 90\n2X Scope: 85\n4X Scope: 80\nSniper: 50')">Open</button>
    </div>

    <div class="card">
        <h2>⚙️ HUD Settings</h2>
        <p>Useful HUD and control settings</p>
        <button onclick="alert('HUD Settings\nAim Button: 48%\nFire Button: 52%\nJoystick: 45%')">Open</button>
    </div>

    <div class="card">
        <h2>📰 FF Updates</h2>
        <p>Latest gaming updates</p>
        <button onclick="alert('Latest Free Fire Updates will be added here!')">Open</button>
    </div>

    <div class="card">
        <h2>🏆 Tournament</h2>
        <p>Gaming tournament information</p>
        <button onclick="alert('Tournament Information')">Open</button>
    </div>

</div>

</body>
</html>
