<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ariyan Zone - Admin Test</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#08080d;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:600px;
    margin:40px auto;
}

.card{
    background:#171720;
    border:1px solid #333;
    border-radius:15px;
    padding:25px;
}

h1{
    text-align:center;
    color:#c084fc;
}

h2{
    color:#a78bfa;
}

.info{
    background:#101018;
    padding:15px;
    border-radius:10px;
    margin:12px 0;
    line-height:1.8;
    word-break:break-word;
}

.success{
    color:#4ade80;
}

.error{
    color:#f87171;
}

.warning{
    color:#facc15;
}

button{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:0;
    border-radius:9px;
    background:#7c3aed;
    color:white;
    font-size:16px;
    font-weight:bold;
}

</style>

</head>


<body>

<div class="container">

<div class="card">

<h1>🔥 ARIYAN ZONE</h1>

<h2>Admin Login Test</h2>

<div id="status" class="info">
Checking Firebase...
</div>

<div id="emailBox" class="info">
Checking login...
</div>

<div id="adminBox" class="info">
Checking admin permission...
</div>

<button
id="loginButton"
style="display:none;"
>
Go to Login
</button>

</div>

</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyAp3MuF_kH85o8_hb61n4igZ3-ruj-fT0",

    authDomain:
    "ariyan-zone.firebaseapp.com",

    projectId:
    "ariyan-zone",

    storageBucket:
    "ariyan-zone.firebasestorage.app",

    messagingSenderId:
    "546027217878",

    appId:
    "1:546027217878:web:20715e9f32fc074fe5ba77",

    measurementId:
    "G-LHZQQTYG88"

};


/* =========================
   ADMIN EMAIL
========================= */

const ADMIN_EMAIL =
    "mdhussainpk01799@gmail.com";


/* =========================
   START FIREBASE
========================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


/* =========================
   HTML
========================= */

const statusBox =
    document.getElementById("status");

const emailBox =
    document.getElementById("emailBox");

const adminBox =
    document.getElementById("adminBox");

const loginButton =
    document.getElementById("loginButton");


/* =========================
   FIREBASE AUTH TEST
========================= */

statusBox.innerHTML =
    '<span class="success">✓ Firebase connected</span>';


onAuthStateChanged(
    auth,
    (user) => {

        if(!user){

            emailBox.innerHTML =
                '<span class="error">✕ No user is logged in.</span>';

            adminBox.innerHTML =
                '<span class="warning">Please login first.</span>';

            loginButton.style.display =
                "block";

            loginButton.onclick =
                () => {

                    window.location.href =
                    "/ariyan-zone/";

                };

            return;

        }


        /* USER FOUND */

        emailBox.innerHTML =

            "<b>Logged-in Email:</b><br>" +
            user.email;


        /* ADMIN CHECK */

        if(
            user.email &&
            user.email.toLowerCase() ===
            ADMIN_EMAIL.toLowerCase()
        ){

            adminBox.innerHTML =

                '<span class="success">' +
                '✓ ADMIN EMAIL MATCHED' +
                '</span>' +

                "<br><br>" +

                "<b>Admin Email:</b><br>" +
                ADMIN_EMAIL;

        }

        else{

            adminBox.innerHTML =

                '<span class="error">' +
                '✕ ADMIN EMAIL DOES NOT MATCH' +
                '</span>' +

                "<br><br>" +

                "<b>Expected:</b><br>" +
                ADMIN_EMAIL +

                "<br><br>" +

                "<b>Currently logged in:</b><br>" +
                user.email;

        }

    }

);


/* =========================
   ERROR HANDLING
========================= */

window.addEventListener(
    "error",
    (event) => {

        statusBox.innerHTML =

            '<span class="error">' +
            'Firebase/JavaScript Error:<br>' +
            event.message +
            '</span>';

    }
);


</script>

</body>

</html>
