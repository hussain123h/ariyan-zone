<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ariyan Zone - Admin Panel</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#08080d;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    padding:25px 10px;
    background:linear-gradient(135deg,#15152e,#32105c);
    border-radius:15px;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    color:#ccc;
}

.card{
    background:#171720;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input,textarea{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #333;
    border-radius:8px;
    background:#0e0e14;
    color:white;
    font-size:15px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    margin:5px;
    background:#7c3aed;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

.logout{
    background:#dc2626;
}

.edit{
    background:#2563eb;
}

.delete{
    background:#dc2626;
}

.update{
    background:#11111a;
    border:1px solid #29293a;
    padding:15px;
    border-radius:10px;
    margin-top:12px;
}

.update h3{
    margin-top:0;
}

.small{
    color:#aaa;
    font-size:13px;
}

.hidden{
    display:none;
}

.success{
    color:#22c55e;
}

.error{
    color:#ef4444;
}

.login-box{
    max-width:450px;
    margin:50px auto;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>🔥 ARIYAN ZONE</h1>
    <p>Admin Control Panel</p>
</div>


<!-- LOGIN -->

<div id="loginSection" class="card login-box">

    <h2>Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

    <p id="loginMessage"></p>

</div>


<!-- ADMIN -->

<div id="adminSection" class="hidden">

<div class="card">

    <h2>✅ Admin Access Granted</h2>

    <p>
        Logged in as:
        <strong id="adminEmail"></strong>
    </p>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</div>


<!-- ADD UPDATE -->

<div class="card">

    <h2>📰 FF Updates</h2>

    <input
        type="text"
        id="title"
        placeholder="Update Title"
    >

    <textarea
        id="content"
        placeholder="Update Content"
    ></textarea>

    <input
        type="text"
        id="image"
        placeholder="Image URL (optional)"
    >

    <label>
        <input
            type="checkbox"
            id="published"
            checked
            style="width:auto"
        >
        Published
    </label>

    <br><br>

    <button onclick="saveUpdate()">
        Add Update
    </button>

    <button
        onclick="cancelEdit()"
        id="cancelButton"
        class="hidden"
    >
        Cancel Edit
    </button>

    <p id="saveMessage"></p>

</div>


<!-- UPDATE LIST -->

<div class="card">

    <h2>📋 Existing Updates</h2>

    <div id="updatesList">
        Loading...
    </div>

</div>

</div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyAp3MuF_kH85o8_hb61n4igZ3-ruj0-fT0",
    authDomain: "ariyan-zone.firebaseapp.com",
    projectId: "ariyan-zone",
    storageBucket: "ariyan-zone.firebasestorage.app",
    messagingSenderId: "546027217878",
    appId: "1:546027217878:web:20715e9f32fc074fe5ba77",
    measurementId: "G-LHZQQTYG88"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   ADMIN EMAIL
========================= */

const ADMIN_EMAIL =
    "mdhussainpk01799@gmail.com";


let editingId = null;


/* =========================
   ELEMENTS
========================= */

const loginSection =
    document.getElementById("loginSection");

const adminSection =
    document.getElementById("adminSection");

const adminEmail =
    document.getElementById("adminEmail");

const loginMessage =
    document.getElementById("loginMessage");

const saveMessage =
    document.getElementById("saveMessage");

const updatesList =
    document.getElementById("updatesList");


/* =========================
   PERSISTENCE
========================= */

setPersistence(
    auth,
    browserLocalPersistence
).catch((error)=>{
    console.error(
        "Persistence error:",
        error
    );
});


/* =========================
   LOGIN
========================= */

window.login = async function(){

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    loginMessage.textContent =
        "Logging in...";

    loginMessage.className = "";


    if(!email || !password){

        loginMessage.textContent =
            "Email and password required.";

        loginMessage.className =
            "error";

        return;
    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(
            "Login error:",
            error
        );

        loginMessage.textContent =
            "Login failed: " +
            error.message;

        loginMessage.className =
            "error";
    }

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    async (user)=>{

    if(user){

        console.log(
            "Firebase user:",
            user.email
        );


        if(
            user.email &&
            user.email.toLowerCase()
            === ADMIN_EMAIL.toLowerCase()
        ){

            loginSection.classList.add(
                "hidden"
            );

            adminSection.classList.remove(
                "hidden"
            );

            adminEmail.textContent =
                user.email;

            await loadUpdates();

        }else{

            await signOut(auth);

            loginSection.classList.remove(
                "hidden"
            );

            adminSection.classList.add(
                "hidden"
            );

            loginMessage.textContent =
                "Access denied. Admin account only.";

            loginMessage.className =
                "error";
        }

    }else{

        loginSection.classList.remove(
            "hidden"
        );

        adminSection.classList.add(
            "hidden"
        );
    }

});


/* =========================
   LOGOUT
========================= */

window.logout = async function(){

    try{

        await signOut(auth);

        location.reload();

    }catch(error){

        console.error(error);

    }

};


/* =========================
   SAVE UPDATE
========================= */

window.saveUpdate = async function(){

    const title =
        document.getElementById("title")
        .value
        .trim();

    const content =
        document.getElementById("content")
        .value
        .trim();

    const image =
        document.getElementById("image")
        .value
        .trim();

    const published =
        document.getElementById("published")
        .checked;


    if(!title || !content){

        saveMessage.textContent =
            "Title and content are required.";

        saveMessage.className =
            "error";

        return;
    }


    saveMessage.textContent =
        "Saving...";

    saveMessage.className = "";


    try{

        if(editingId){

            const updateRef =
                doc(
                    db,
                    "updates",
                    editingId
                );

            await updateDoc(
                updateRef,
                {
                    title: title,
                    content: content,
                    image: image,
                    published: published,
                    updatedAt:
                        serverTimestamp()
                }
            );

            saveMessage.textContent =
                "Update edited successfully.";

        }else{

            await addDoc(
                collection(db,"updates"),
                {
                    title: title,
                    content: content,
                    image: image,
                    published: published,
                    createdAt:
                        serverTimestamp()
                }
            );

            saveMessage.textContent =
                "Update added successfully.";
        }


        saveMessage.className =
            "success";

        clearForm();

        await loadUpdates();


    }catch(error){

        console.error(
            "Firestore error:",
            error
        );

        saveMessage.textContent =
            "Firestore error: " +
            error.message;

        saveMessage.className =
            "error";
    }

};


/* =========================
   LOAD UPDATES
========================= */

async function loadUpdates(){

    updatesList.innerHTML =
        "Loading updates...";


    try{

        const q =
            query(
                collection(db,"updates"),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(q);


        if(snapshot.empty){

            updatesList.innerHTML =
                "<p>No updates yet.</p>";

            return;
        }


        updatesList.innerHTML = "";


        snapshot.forEach((item)=>{

            const data =
                item.data();


            const div =
                document.createElement("div");

            div.className =
                "update";


            div.innerHTML = `

                <h3>
                    ${escapeHTML(
                        data.title || ""
                    )}
                </h3>

                <p>
                    ${escapeHTML(
                        data.content || ""
                    )}
                </p>

                ${
                    data.image
                    ?
                    `<p class="small">
                        Image:
                        ${escapeHTML(
                            data.image
                        )}
                    </p>`
                    :
                    ""
                }

                <p class="small">
                    Published:
                    ${
                        data.published
                        ? "Yes"
                        : "No"
                    }
                </p>

                <button
                    class="edit"
                    onclick="editUpdate('${item.id}')"
                >
                    Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteUpdate('${item.id}')"
                >
                    Delete
                </button>
            `;


            updatesList.appendChild(div);

        });


    }catch(error){

        console.error(
            "Load error:",
            error
        );

        updatesList.innerHTML =
            `<p class="error">
                Could not load updates.<br>
                ${escapeHTML(
                    error.message
                )}
            </p>`;
    }

}


/* =========================
   EDIT UPDATE
========================= */

window.editUpdate = async function(id){

    try{

        const snapshot =
            await getDocs(
                collection(db,"updates")
            );


        let found = null;


        snapshot.forEach((item)=>{

            if(item.id === id){

                found = {
                    id: item.id,
                    ...item.data()
                };

            }

        });


        if(!found){

            alert(
                "Update not found."
            );

            return;
        }


        document.getElementById(
            "title"
        ).value =
            found.title || "";


        document.getElementById(
            "content"
        ).value =
            found.content || "";


        document.getElementById(
            "image"
        ).value =
            found.image || "";


        document.getElementById(
            "published"
        ).checked =
            found.published === true;


        editingId = id;


        document.getElementById(
            "cancelButton"
        ).classList.remove(
            "hidden"
        );


        document.getElementById(
            "title"
        ).scrollIntoView({
            behavior:"smooth"
        });


    }catch(error){

        alert(
            "Error: " +
            error.message
        );
    }

};


/* =========================
   DELETE UPDATE
========================= */

window.deleteUpdate = async function(id){

    const confirmDelete =
        confirm(
            "Delete this update?"
        );


    if(!confirmDelete){

        return;
    }


    try{

        await deleteDoc(
            doc(
                db,
                "updates",
                id
            )
        );


        await loadUpdates();


    }catch(error){

        alert(
            "Delete error: " +
            error.message
        );
    }

};


/* =========================
   CANCEL EDIT
========================= */

window.cancelEdit = function(){

    editingId = null;

    clearForm();

    document.getElementById(
        "cancelButton"
    ).classList.add(
        "hidden"
    );

    saveMessage.textContent = "";

};


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

    document.getElementById(
        "title"
    ).value = "";

    document.getElementById(
        "content"
    ).value = "";

    document.getElementById(
        "image"
    ).value = "";

    document.getElementById(
        "published"
    ).checked = true;

    editingId = null;

    document.getElementById(
        "cancelButton"
    ).classList.add(
        "hidden"
    );

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}

</script>

</body>
</html>
